<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 300px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #111827;
      color: #F9FAFB;
    }
    h3 { margin: 0 0 10px 0; font-size: 14px; font-weight: 600; text-overflow: ellipsis; overflow: hidden; white-space: nowrap; }
    img#preview {
      width: 100%;
      height: 160px;
      object-fit: cover;
      border-radius: 8px;
      border: 1px solid #374151;
      margin-bottom: 12px;
      background: #1F2937;
    }
    .meta { font-size: 12px; color: #9CA3AF; margin-bottom: 12px; }
    button {
      width: 100%;
      padding: 10px;
      background: #4F46E5;
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #4338CA; }
    .status { font-size: 11px; color: #10B981; margin-top: 8px; text-align: center; }
  </style>
</head>
<body>
  <h3 id="title">Loading...</h3>
  <img id="preview" style="display:none;" />
  <div class="meta" id="details"></div>
  <button id="saveBtn" disabled>Save to Recall</button>
  <div class="status" id="statusText"></div>
  <script src="popup.js"></script>
</body>
</html>
